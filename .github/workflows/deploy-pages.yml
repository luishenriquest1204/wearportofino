# Builds the PUBLIC site (pre-launch mode, no admin) and publishes it on GitHub Pages.
# Repository Settings → Pages → Build and deployment → Source must be "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Public build only: VITE_STORE_MODE=prelaunch and VITE_INCLUDE_ADMIN=false come from .env
      - run: npm run build
      - name: Refuse to publish the admin
        run: |
          if ls dist/assets | grep -qi '^Admin-'; then echo "Admin chunk found in public build"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
