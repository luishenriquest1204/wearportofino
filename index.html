<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="PORTOFINO — a maison of 100% linen. Quiet luxury from the Mediterranean." />
    <title>PORTOFINO — A new destination awaits</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PORTOFINO" />
    <meta property="og:title" content="PORTOFINO — A new destination awaits." />
    <meta property="og:description" content="A maison of 100% linen. Quiet luxury by the Mediterranean, made to last. Since MMXXVI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <script>
      // Before first paint: enable reveal styles only when motion is allowed; skip the intro on repeat visits.
      (function () {
        var d = document.documentElement;
        try {
          var r = matchMedia("(prefers-reduced-motion: reduce)").matches, seen = false;
          try { seen = sessionStorage.getItem("pf-intro") === "1"; sessionStorage.setItem("pf-intro", "1"); } catch (e) { seen = true; }
          if (seen || r) d.classList.add("intro-seen");
          if (!r) { d.classList.add("motion"); setTimeout(function () { if (!window.__pfMotion) d.classList.remove("motion"); }, 4000); }
        } catch (e) { d.classList.add("intro-seen"); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PORTOFINO — a maison of 100% linen. Shirts, blouses, trousers and shorts in pure linen. Official launch soon. Please enable JavaScript to explore the collection.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
